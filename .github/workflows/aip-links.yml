# Weekly: every official AIP link Birdbird shows must still answer. A failed run e-mails the repository owner.
name: AIP links
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['aip.js', 'tools/build-aip-de.mjs', 'functions/_lib/aipres.js', 'tests/aip-links.mjs', '.github/workflows/aip-links.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Germany's aerodrome list (DFS permalinks), committed when it changed
        run: |
          node tools/build-aip-de.mjs
          if ! git diff --quiet -- functions/_lib/aip-de.js; then
            git config user.name "aip-links"; git config user.email "actions@github.com"
            git add functions/_lib/aip-de.js && git commit -qm "Germany: aerodrome list updated from DFS" && git push
          fi
      - run: node tests/aip-links.mjs
