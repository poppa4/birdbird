# Weekly: every official AIP link Birdbird shows must still answer. A failed run e-mails the repository owner.
name: AIP links
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['aip.js', 'functions/_lib/aipres.js', 'tests/aip-links.mjs', '.github/workflows/aip-links.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/aip-links.mjs
