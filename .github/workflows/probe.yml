name: AIP probe
on:
  push:
    branches: [aip-probe]
jobs:
  p:
    runs-on: ubuntu-latest
    env: { NODE_TLS_REJECT_UNAUTHORIZED: '0' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node tools/build-aip-de.mjs && gzip -c functions/_lib/aip-de.js | base64 -w0 | sed "s/^/B64 /"; echo
