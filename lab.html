<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Lab · Birdbird</title>
<meta name="description" content="28 interactive labs in seven subject areas, from aerodynamics and meteorology to performance and mass and balance. Principles for every aircraft; numbers from an illustrative A320 model.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="lab.css?v=7">
<link rel="stylesheet" href="site.css?v=12">
<style>
/* Virtual Labs start page: seven subject areas (Atlas), full topic list behind an expander, quiet "More". */
.lhead .stats{display:flex;flex-wrap:wrap;gap:0;margin:28px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.lhead .stats div{padding:12px 28px 14px 0;margin-right:28px;border-right:1px solid var(--rule-2)}
.lhead .stats div:last-child{border-right:0}
.lhead .stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.lhead .stats span{font-size:13px;color:var(--ink-2)}
@media (max-width:600px){.lhead .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.lhead .stats div{padding:10px 8px 12px 0;margin-right:8px}.lhead .stats b{font-size:22px}}

.areas{display:flex;flex-direction:column;gap:12px;margin:36px 0 0;padding:0;list-style:none}
.area{display:grid;grid-template-columns:52px minmax(0,1fr) 260px;gap:14px 32px;align-items:start;padding:24px 26px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius-lg);scroll-margin-top:24px;transition:border-color .15s}
.area:hover{border-color:#9AA8AE}
.area.hit{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.area .no{font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--ink-3);padding-top:5px}
.area h2{font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:25px;line-height:1.12;margin:0;text-wrap:balance}
.area h2 a{color:var(--ink);text-decoration:none}.area h2 a:hover{color:var(--accent)}
.area .d{margin:8px 0 0;color:var(--ink-2);font-size:15px;line-height:1.5;max-width:52ch}
.area .n{margin:10px 0 0;font-size:13px;color:var(--ink-3);font-family:var(--f-mono)}
.area .lw small,.area .go small{display:block;font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:2px 0 8px}
.area .lw ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.area .lw li{position:relative;padding-left:14px;font-size:14.5px;line-height:1.4;color:var(--ink)}
.area .lw li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--rule)}
.area .go{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.area .go b{font-family:var(--f-display);font-stretch:92%;font-size:16px;font-weight:650;line-height:1.3;margin:0 0 6px}
.area .go .tag{margin:0 0 14px}
@media (max-width:1100px){.area{grid-template-columns:44px minmax(0,1fr)}.area .go{grid-column:2/-1;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 14px;border-top:1px solid var(--rule-2);padding-top:14px}.area .go small{flex-basis:100%;margin:0}.area .go b,.area .go .tag{margin:0}.area .go .btn{margin-left:auto}}
@media (max-width:720px){.area{grid-template-columns:minmax(0,1fr);gap:14px;padding:18px 18px 20px}.area .no{padding:0;font-size:12.5px}.area .go{grid-column:auto}.area h2{font-size:22px}.area .go .btn{margin-left:0;width:100%}}

/* all topics: expander + search */
.all{margin:28px 0 0;border-top:1px solid var(--ink)}
.all>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px 0;font-family:var(--f-display);font-stretch:92%;font-size:19px;font-weight:650;color:var(--ink)}
.all>summary::-webkit-details-marker{display:none}
.all>summary span{font-family:var(--f-body);font-size:13.5px;font-weight:500;color:var(--ink-2)}
.all>summary::after{content:"+";font-family:var(--f-mono);font-size:18px;color:var(--ink-2);margin-left:auto}
.all[open]>summary::after{content:"−"}
.all>summary:hover{color:var(--accent)}
.find{display:flex;gap:12px;align-items:center;margin:0 0 18px}
.find input{flex:1;min-width:0;max-width:520px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sheet);color:var(--ink)}
.find input:focus{border-color:var(--ink);outline:0}
.find span{font-size:13px;color:var(--ink-2);white-space:nowrap}
.tgrid{columns:3 300px;column-gap:40px}
.tg{break-inside:avoid;margin:0 0 26px}
.tg h3{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule-2)}
.tl{margin:0 0 12px}
.tl>a{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.3}
.tl>a:hover{color:var(--accent)}
.tl ul{list-style:none;margin:4px 0 0;padding:0 0 0 12px;border-left:1px solid var(--rule-2)}
.tl li a{display:block;padding:2px 0;font-size:13.5px;color:var(--ink-2);text-decoration:none;line-height:1.4}
.tl li a:hover{color:var(--accent);text-decoration:underline}
.tl .tag{font-size:10px;padding:3px 4px 2px}
mark{background:#F3DCE9;color:inherit;padding:0 1px}
.none{color:var(--ink-2);font-size:14px;padding:4px 0 20px}

/* More: quiet */
.moreq{margin:36px 0 0;padding-top:14px;border-top:1px solid var(--rule-2);display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 24px;font-size:14px;color:var(--ink-2);scroll-margin-top:24px}
.moreq .h{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-top:2px}
.moreq ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.moreq a{color:var(--ink);text-decoration:none;font-weight:500}
.moreq a:hover{color:var(--accent);text-decoration:underline}
.moreq em{font-style:normal;color:var(--ink-3)}
@media (max-width:600px){.moreq{grid-template-columns:minmax(0,1fr)}}
.foot{margin-top:32px}
</style>
</head>
<body data-title="Virtual Labs">
<script src="site.js?v=35"></script>
<div class="page">
  <header class="lhead">
    <div class="brand">
      <div class="eyebrow">Birdbird · Theory for pilots</div>
      <h1>Virtual Labs</h1>
      <p id="lead"></p>
      <div class="stats" id="stats"></div>
    </div>
    <div class="hright"></div>
  </header>
  <ol class="areas" id="areas"></ol>
  <details class="all" id="all"><summary id="allSum"></summary><div class="find"><input id="q" type="search" autocomplete="off"><span id="qn"></span></div><div id="tlist"></div></details>
  <section class="moreq" id="more" aria-labelledby="moreH"></section>
  <p class="foot note" id="foot"></p>
</div>
<script src="lab.js?v=34"></script>
<script>
(function(){
'use strict';
const {L,el}=LAB, AREAS=LAB.AREAS, MORE=LAB.MORE, TOP=LAB.TOP, LVX=LAB.LVX, LVTIP=LAB.LVTIP;
const t=(en,no)=>({en,no});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=l=>L({en:l[2],no:l[3]});
const ALL=AREAS.flatMap(m=>m.labs), NMORE=MORE.reduce((a,m)=>a+m.labs.length,0);
const tops=l=>(TOP[l[0]]||[]).map(([a,en,no,ty])=>[a,a==='quiz'?t('Test yourself','Test deg selv'):t(en,no),ty]);
const NTOP=[...AREAS,...MORE].reduce((a,m)=>a+m.labs.reduce((b,l)=>b+tops(l).length,0),0);
const tag=l=>{ const x=LVX[l[4]]||LVX['']; return `<span class="tag ${x.c}" title="${esc(L(LVTIP[l[4]]||LVTIP['']))}">${esc(L(x))}</span>`; };
const pad=i=>String(i).padStart(2,'0');
let q='';

function draw(){
  const no=LAB.lang==='no';
  el('lead').textContent=L(t(`The theory behind flying, as interactive models you can adjust. ${ALL.length+NMORE} labs: ${ALL.length} in seven subject areas, and ${NMORE} on human factors under More. Pick an area and start with its first lab; every lab is tagged with what it applies to.`,`Teorien bak flygingen, som interaktive modeller du kan stille på. ${ALL.length+NMORE} labber: ${ALL.length} i sju fagområder, og ${NMORE} om menneskelige faktorer under Mer. Velg et område og start med den første labben; hver lab er merket med hva den gjelder.`));
  el('stats').innerHTML=`<div><b>${AREAS.length}</b><span>${no?'fagområder':'subject areas'}</span></div><div><b>${ALL.length+NMORE}</b><span>${no?'labber':'labs'}</span></div><div><b>${NTOP}</b><span>${no?'emner':'topics'}</span></div>`;
  el('areas').setAttribute('aria-label',L(t('Subject areas','Fagområder')));
  el('areas').innerHTML=AREAS.map((m,i)=>{ const f=m.labs[0];
    return `<li class="area" id="${m.k}"><span class="no">${pad(i+1)}</span>`+
      `<div><h2><a href="${f[0]}">${esc(L(m))}</a></h2><p class="d">${esc(L(m.d))}</p><p class="n">${m.labs.length} ${esc(L(m.labs.length===1?t('lab','lab'):t('labs','labber')))}</p></div>`+
      `<div class="go"><small>${esc(L(t('Start with','Start med')))}</small><b>${esc(nm(f))}</b>${tag(f)}<a class="btn pri" href="${f[0]}" aria-label="${esc(L(t('Open','Åpne'))+': '+L(m))}">${esc(L(t('Open area','Åpne området')))} →</a></div></li>`; }).join('');
  el('allSum').innerHTML=`${esc(L(t('All topics','Alle emner')))}<span>${ALL.length+NMORE} ${no?'labber':'labs'} · ${NTOP} ${no?'emner':'topics'}</span>`;
  const qi=el('q'); qi.placeholder=L(t('Search labs and topics …','Søk i labber og emner …')); qi.setAttribute('aria-label',L(t('Search labs and topics','Søk i labber og emner')));
  el('more').innerHTML=`<span class="h" id="moreH">${esc(L(t('More','Mer')))}</span><ul>${MORE.map(m=>m.labs.map(l=>`<li><a href="${l[0]}">${esc(nm(l))}</a> <em>· ${esc(L(m))}</em></li>`).join('')).join('')}<li><a href="simcheck.html">${esc(L(t('A320 sim assessment','A320 simulatortest')))}</a> <em>· ${esc(L(t('puts the labs together before a sim check','setter labbene sammen før en simulatorsjekk')))}</em></li></ul>`;
  el('foot').textContent=L(t('Teaching models for understanding, not a question bank. Follow the AIP, the flight manual and your operator’s procedures for numbers you fly with.','Opplæringsmodeller for forståelse, ikke en spørsmålsbank. Følg AIP, flyhåndboken og operatørens prosedyrer for tallene du flyr etter.'));
  list();
}
function hl(s){ const x=esc(s); if(!q) return x; const i=x.toLowerCase().indexOf(esc(q).toLowerCase()); return i<0?x:x.slice(0,i)+'<mark>'+x.slice(i,i+esc(q).length)+'</mark>'+x.slice(i+esc(q).length); }
function list(){
  const ql=q.toLowerCase(); let nL=0, nT=0;
  const grp=(m,label)=>{ const labs=m.labs.map(l=>{ const lm=(l[2]+' '+l[3]).toLowerCase().includes(ql);
      const ts=tops(l).filter(([a,n])=>!ql||lm||(n.en+' '+n.no).toLowerCase().includes(ql)); if(ql&&!lm&&!ts.length) return '';
      nL++; nT+=ts.length;
      return `<div class="tl"><a href="${l[0]}">${hl(nm(l))} ${tag(l)}</a><ul>${ts.map(([a,n])=>`<li><a href="${l[0]}#${a}">${hl(L(n))}</a></li>`).join('')}</ul></div>`; }).join('');
    return labs?`<div class="tg"><h3>${label}</h3>${labs}</div>`:''; };
  const html=AREAS.map((m,i)=>grp(m,`${pad(i+1)} · ${esc(L(m))}`)).join('')+MORE.map(m=>grp(m,`${esc(L(t('More','Mer')))} · ${esc(L(m))}`)).join('');
  el('tlist').innerHTML=html?`<div class="tgrid">${html}</div>`:`<p class="none">${esc(L(t('No labs or topics match.','Ingen labber eller emner passer.')))}</p>`;
  el('qn').textContent=q?L(t(`${nL} labs · ${nT} topics`,`${nL} labber · ${nT} emner`)):'';
}
el('q').addEventListener('input',e=>{ q=e.target.value.trim(); list(); });
/* hash: #<area> highlights its card, #all opens the topic list, #hf goes to More; old module keys still land */
const OLD={air:'inst',fpl:'perf',path:'',hf:'more'};
function hash(){ let k=(location.hash||'').slice(1); if(k in OLD) k=OLD[k]; document.querySelectorAll('.area.hit').forEach(x=>x.classList.remove('hit'));
  if(k==='all'){ el('all').open=true; el('all').scrollIntoView(); el('q').focus({preventScroll:true}); return; }
  const a=k&&document.getElementById(k); if(a){ if(a.classList.contains('area')) a.classList.add('hit'); a.scrollIntoView(); } }
window.addEventListener('hashchange',hash);
LAB.start('labs'); LAB.onLang(draw); draw(); hash();
})();
</script>
</body>
</html>
