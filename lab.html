<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virtual Lab · Birdbird</title>
<meta name="description" content="25 interactive labs covering the theory behind flying, from principles of flight to human performance, built on the A320.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="lab.css?v=6">
<link rel="stylesheet" href="site.css?v=11">
<style>
/* Virtual Lab index: learning path (numbered modules) and the topic register (clean table with filters). */
.vtabs{display:flex;gap:0 28px;margin:32px 0 0;border-bottom:1px solid var(--rule)}
.vtabs button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0 11px;font:inherit;font-size:15px;font-weight:500;color:var(--ink-2);cursor:pointer;display:flex;align-items:baseline;gap:8px}
.vtabs button i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.vtabs button:hover{color:var(--ink)}
.vtabs button.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.lhead .stats{display:flex;flex-wrap:wrap;gap:0;margin:28px 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.lhead .stats div{padding:12px 28px 14px 0;margin-right:28px;border-right:1px solid var(--rule-2)}
.lhead .stats div:last-child{border-right:0}
.lhead .stats b{display:block;font-family:var(--f-mono);font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.lhead .stats span{font-size:13px;color:var(--ink-2)}
.lhead .stats .pbar{display:block;width:120px;height:4px;background:var(--rule-2);margin-top:8px}
.lhead .stats .pbar i{display:block;height:100%;background:var(--ok)}

/* continue card */
.next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:center;margin:32px 0 0;padding:20px 24px;background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:0 var(--radius) var(--radius) 0}
.next small{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.next b{display:block;font-family:var(--f-display);font-stretch:88%;font-size:24px;font-weight:700;line-height:1.15}
.next p{margin:4px 0 0;font-size:14px;color:var(--ink-2)}
@media (max-width:600px){.next{grid-template-columns:minmax(0,1fr);padding:16px 18px}.next .btn{justify-self:start}}

/* learning path: numbered modules */
.mods{margin:16px 0 0}
.mod{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px 40px;padding:28px 0;border-top:1px solid var(--rule);scroll-margin-top:16px}
.mod:first-child{border-top:0}
.mh{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
.mh .no{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--ink-3);letter-spacing:.04em}
.mh h2{font-family:var(--f-display);font-stretch:88%;font-weight:700;font-size:24px;line-height:1.12;margin:0;text-wrap:balance}
.mh h2 a{color:inherit;text-decoration:none}.mh h2 a:hover{color:var(--accent)}
.mh .mp{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);margin-top:4px}
.mh .mp .bar{flex:0 0 72px;height:4px;background:var(--rule-2);display:flex;gap:2px}
.mh .mp .bar i{flex:1;background:var(--rule-2)}.mh .mp .bar i.d{background:var(--ok)}
.labs{display:flex;flex-direction:column;gap:8px;min-width:0}
.lrow{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 18px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);text-decoration:none;color:var(--ink);position:relative}
.lrow:hover{border-color:var(--ink)}
.lrow .n{font-family:var(--f-mono);font-size:14px;font-weight:500;color:var(--ink-3)}
.lrow .t{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0}
.lrow .t b{font-family:var(--f-display);font-stretch:92%;font-size:18px;font-weight:650;line-height:1.25}
.lrow .tp{grid-column:2;font-size:13px;color:var(--ink-2);line-height:1.45}
.lrow .st{grid-column:3;grid-row:1/span 2;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.lrow .st .ok{display:inline-flex;align-items:center;gap:6px;color:var(--ok);font-weight:600}
.lrow .st .ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.lrow .st .v{font-family:var(--f-mono);font-size:12.5px}
.lrow.nx{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.lrow.nx .n{color:var(--accent)}
.lrow .go{font-weight:600;color:var(--accent)}
.lrow.dn .n{color:var(--ok)}
.cap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px 40px;padding:28px 0 0;border-top:1px solid var(--ink)}
.cap .mh .no{color:var(--accent)}
@media (max-width:900px){
  .mod,.cap{grid-template-columns:minmax(0,1fr);gap:12px;padding:24px 0}
  .mh{position:static;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .mh h2{font-size:22px;flex:1 1 auto}
  .mh .mp{flex-basis:100%;margin:0}
}
@media (max-width:600px){
  .lrow{grid-template-columns:30px minmax(0,1fr);padding:14px 14px 14px 12px;gap:4px 10px}
  .lrow .n{align-self:start;padding-top:2px}
  .lrow .st{grid-column:2;grid-row:auto;margin-top:4px}
  .lrow .t b{font-size:17px}
}

/* register: filters + clean table */
.reg{display:grid;grid-template-columns:250px minmax(0,1fr);gap:32px;margin:28px 0 0;align-items:start}
.filt{display:flex;flex-direction:column;gap:20px;position:sticky;top:16px}
.filt .fh{font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.filt .fh button{background:none;border:0;padding:0;font:inherit;font-family:var(--f-body);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--info);cursor:pointer}
.filt .fh button+button{margin-left:10px}
.filt .find input{width:100%;font:inherit;font-size:15px;padding:9px 12px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sheet);color:var(--ink)}
.filt .find input:focus{border-color:var(--ink);outline:0}
.cats{display:flex;flex-direction:column;border-top:1px solid var(--rule-2)}
.cats button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule-2);padding:8px 10px 8px 0;font:inherit;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.35}
.cats button i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.cats button:hover{color:var(--ink)}
.cats button.on{color:var(--ink);font-weight:600;box-shadow:inset 2px 0 0 var(--accent);padding-left:10px}
.chk{display:flex;flex-direction:column;gap:2px}
.chk label{display:flex;align-items:center;gap:10px;padding:4px 0;cursor:pointer;font-size:14px;line-height:1.3;color:var(--ink)}
.chk input{accent-color:var(--ink);width:15px;height:15px;margin:0;flex:0 0 auto}
.chk label i{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.modsel{display:none}
.tblw{min-width:0}
.tblh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 10px;font-size:13px;color:var(--ink-2)}
.tblh b{font-family:var(--f-display);font-stretch:88%;font-size:22px;font-weight:700;color:var(--ink)}
.list{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);font-size:14.5px}
.list th{position:sticky;top:0;z-index:1;background:var(--wash);text-align:left;font-family:var(--f-mono);font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);padding:10px 14px;border-bottom:1px solid var(--rule)}
.list td{padding:11px 14px;border-bottom:1px solid var(--rule-2);vertical-align:middle}
.list tr:last-child td{border-bottom:0}
.list tbody tr:hover td{background:#FAFBFA}
.list a{color:var(--ink);text-decoration:none;font-weight:600}
.list a:hover{color:var(--accent);text-decoration:underline}
.list td.lab,.list td.lab a{color:var(--ink-2);font-weight:400}
.list td.lab .tag{margin-left:8px}
.list td.ty{width:1%;white-space:nowrap}
.list .lt{display:none}
.tag.t-sim{color:var(--ink)}.tag.t-drill{color:var(--info)}.tag.t-read{color:var(--ink-2)}.tag.t-quiz{color:var(--ok)}
.empty{padding:28px 14px;color:var(--ink-2);background:var(--sheet);border:1px solid var(--rule);border-top:0}
.sw{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
@media (max-width:600px){.lhead .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}.lhead .stats div{padding:10px 8px 12px 0;margin-right:8px}.lhead .stats b{font-size:22px}.lhead .stats .pbar{width:100%}}
@media (max-width:900px){
  .reg{grid-template-columns:minmax(0,1fr);gap:16px}
  .filt{position:static;gap:14px}
  .filt .catbox{display:none}
  .modsel{display:block}
  .modsel select{width:100%;font:inherit;font-size:15px;font-weight:600;padding:9px 10px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--sheet);color:var(--ink);min-height:42px}
  details.more>summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--ink);list-style:none;display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--rule-2);border-bottom:1px solid var(--rule-2)}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-2)}
  details.more[open]>summary::after{content:"−"}
  details.more[open]>summary{margin-bottom:12px}
  .chk.labs2{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
  .list .hlab,.list td.lab{display:none}
  .list .lt{display:block;font-size:12.5px;color:var(--ink-2);font-weight:400;margin-top:2px}
  .list td{padding:10px 12px}
}
@media (min-width:901px){details.more>summary{display:none}}
@media (max-width:420px){.chk.labs2{grid-template-columns:1fr}}
.foot{margin-top:32px}
</style>
</head>

<script>
(function(){
'use strict';
const {L,el}=LAB, PATH=LAB.PATH, LV=LAB.LV;
const TOP=/*TOPICS*/{"tunnel.html":[["profil","Aerofoil section and stall","Profilsnitt og stall","sim"],["tunnel","3D wind tunnel","3D-vindtunnel","sim"],["try","Things to try","Prøv dette","read"],["wake","Wingtip vortices","Vingetippvirvler","sim"],["ground","Ground effect","Bakkeeffekt","sim"],["quiz","Test yourself","Test deg selv","quiz"]],"stability.html":[["long","Longitudinal stability","Lengdestabilitet","sim"],["lat","Lateral and directional","Tverr- og retningsstabilitet","sim"],["vn","Load factor","Lastfaktor","sim"],["controls","Flight controls","Flykontroller","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"propeller.html":[["single","VMCA lab","VMCA-lab","sim"],["cert","Certification and speeds","Sertifisering og farter","read"],["twin","VMCG and VMCL","VMCG og VMCL","sim"],["ops","Failure after V1","Motorstans etter V1","read"],["quiz","Test yourself","Test deg selv","quiz"]],"highspeed.html":[["drag","Drag and speed stability","Motstand og fartsstabilitet","sim"],["mach","Mach and compressibility","Mach og kompressibilitet","sim"],["coffin","Buffet boundary","Buffetgrense","sim"],["swept","The swept wing","Pilvingen","sim"],["upset","Upset recovery","Upset recovery","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"altimetry.html":[["xs","Why the altimeter lies","Hvorfor høydemåleren lyver","sim"],["set","Altimeter settings","Høydemålerinnstillinger","sim"],["da","Density altitude","Tetthetshøyde","sim"],["cold","Cold temperature","Kulde","sim"],["quiz","Test yourself","Test deg selv","quiz"]],"pitot.html":[["lab","The lab","Labben","sim"],["table","What each fault does","Hva hver feil gjør","read"],["wind","Wind and weather","Vind og vær","sim"],["uas","Unreliable airspeed","Upålitelig fart","sim"],["quiz","Test yourself","Test deg selv","quiz"]],"clouds.html":[["lift","Lift a parcel","Løft en luftpakke","sim"],["fog","Fog overnight","Tåke gjennom natten","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"fronts.html":[["lab","Fly through a front","Fly gjennom en front","sim"],["table","The fronts side by side","Frontene side om side","read"],["stab","Highs and lows","Høytrykk og lavtrykk","sim"],["forces","Why the wind blows","Hvorfor vinden blåser","sim"],["local","Local winds","Lokale vinder","sim"],["press","Air masses, jet streams and charts","Luftmasser, jetstrømmer og kart","read"],["global","Global circulation","Global sirkulasjon","sim"],["quiz","Test yourself","Test deg selv","quiz"]],"storms.html":[["life","The life of a CB","Livet til en CB","sim"],["radar","Around a cell","Rundt en celle","sim"],["shear","Microburst on final","Mikroburst på finalen","sim"],["wxr","Weather radar","Værradar","sim"],["types","Types and warnings","Typer og varsler","read"],["quiz","Test yourself","Test deg selv","quiz"]],"hazards.html":[["icing","Icing","Ising","sim"],["deice","De-icing","Avising","sim"],["turb","Turbulence","Turbulens","sim"],["wake","Wake turbulence","Vaketurbulens","sim"],["more","Other hazards","Andre farer","read"],["quiz","Test yourself","Test deg selv","quiz"]],"engines.html":[["eng","Take it apart","Ta den fra hverandre","sim"],["start","Start and spool-up","Start og spoling","sim"],["rating","Flat rating and FLEX","Flat rating og FLEX","sim"],["cmp","A320 engines","A320-motorer","read"],["ops","In the cockpit","I cockpit","read"],["quiz","Test yourself","Test deg selv","quiz"]],"jetsystems.html":[["hyd","Hydraulics","Hydraulikk","sim"],["fbw","Fly-by-wire","Fly-by-wire","sim"],["elec","Electrics","Elektrisk","sim"],["gear","Gear and brakes","Understell og bremser","sim"],["fuelbleed","Fuel, bleed and fire","Drivstoff, bleed og brann","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"pressurisation.html":[["cabin","Cabin altitude","Kabinhøyde","sim"],["decomp","Decompression","Dekompresjon","sim"],["hypoxia","Hypoxia","Hypoksi","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"gyros.html":[["compass","Magnetic compass","Magnetkompass","sim"],["gyro","Gyroscopes","Gyroskoper","sim"],["irs","From gyros to ADIRS","Fra gyro til ADIRS","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"autoflight.html":[["fma","Reading the FMA","Lese FMA-en","sim"],["traps","Mode traps","Modusfeller","drill"],["tcas","TCAS","TCAS","sim"],["gpws","EGPWS","EGPWS","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"massbalance.html":[["masses","Masses and limits","Masser og grenser","sim"],["cg","Centre of gravity","Tyngdepunkt","sim"],["loadsheet","Load sheet","Lasteark","drill"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"performance.html":[["takeoff","Take-off and V1","Start og V1","sim"],["limits","Take-off mass limits","Begrensninger for startvekt","sim"],["climb","Climb and cruise","Stigning og cruise","sim"],["enroute","Engine failure en route","Motorstans underveis","sim"],["landing","Landing distance","Landingsdistanse","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"gennav.html":[["triangle","Wind triangle","Vindtrekanten","sim"],["sixty","1 in 60","1 av 60","sim"],["earth","Earth and directions","Jorden og retninger","sim"],["charts","Chart projections","Kartprojeksjoner","sim"],["time","Time","Tid","sim"],["pet","PET and PNR","PET og PNR","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"radionav.html":[["lab","Move the aircraft","Flytt flyet","sim"],["chal","Where am I?","Hvor er jeg?","drill"],["radar","Radar and ADS-B","Radar og ADS-B","sim"],["notes","What to remember","Det du må huske","read"],["quiz","Test yourself","Test deg selv","quiz"]],"gnss.html":[["sat","Satellite geometry","Satellittgeometri","sim"],["wp","Waypoints and turns","Veipunkter og svinger","sim"],["spec","Specifications and minima","Spesifikasjoner og minima","read"],["risk","Threats","Trusler","read"],["quiz","Test yourself","Test deg selv","quiz"]],"holding.html":[["anatomy","Anatomy of a hold","Oppbygningen av en holding","read"],["entry","Entry trainer","Entry-trener","sim"],["wind","Wind correction","Vindkorreksjon","sim"],["drill","Entry drill","Entry-drill","drill"],["quiz","Test yourself","Test deg selv","quiz"]],"approach.html":[["lab","Needles and geometry","Nåler og geometri","sim"],["rod","Rate of descent","Sinkrate","sim"],["ils","Inside the ILS signal","Inne i ILS-signalet","sim"],["seg","Segments and minima","Segmenter og minima","read"],["quiz","Test yourself","Test deg selv","quiz"]],"flightplanning.html":[["fuel","Fuel make-up","Drivstoffsammensetning","sim"],["alternates","Alternates and minima","Alternativer og minima","sim"],["inflight","In-flight fuel","Drivstoff under flyging","drill"],["tanker","Tankering","Tankering","sim"],["cruise","Level and cost index","Høyde og kostindeks","sim"],["atc","ATC flight plan","ATC-færdselsplan","read"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]],"orientation.html":[["senses","The three senses","De tre sansene","read"],["ear","Inner ear simulator","Indre øre-simulator","sim"],["trainer","Trainer","Trener","drill"],["approach","Approach illusions","Illusjoner på innflyging","sim"],["other","Other illusions","Andre illusjoner","read"],["quiz","Test yourself","Test deg selv","quiz"]],"humanperf.html":[["info","Information processing","Informasjonsbehandling","sim"],["workload","Workload","Arbeidsbelastning","sim"],["fatigue","Fatigue","Tretthet","sim"],["tem","Threat and error","Trusler og feil","drill"],["vision","Vision","Syn","sim"],["ops","In the aircraft","I flyet","read"],["quiz","Test yourself","Test deg selv","quiz"]]}/*END*/;
const t=(en,no)=>({en,no});
const TYPES=[['sim',t('Interactive','Interaktiv')],['drill',t('Drill','Drill')],['read',t('Reading','Lesestoff')],['quiz',t('Quiz','Quiz')]];
const QZ=t('Test yourself','Test deg selv');
const S={cat:'path',labs:{},types:{sim:1,drill:1,read:1,quiz:0},q:''};
try{ const s=JSON.parse(localStorage.getItem('vlab-reg')||'null'); if(s&&s.types) S.types=s.types; if(s&&s.labs) S.labs=s.labs; }catch(e){}
const valid=k=>k==='path'||k==='all'||PATH.some(m=>m.k===k);
const h=(location.hash||'').slice(1); if(valid(h)) S.cat=h;
const save=()=>{ try{ localStorage.setItem('vlab-reg',JSON.stringify({types:S.types,labs:S.labs})); }catch(e){} };
const nm=l=>L({en:l[2],no:l[3]});
const ALL=PATH.flatMap(m=>m.labs);
const labsOf=cat=> (cat==='all'||cat==='path')? ALL : PATH.find(m=>m.k===cat).labs;
const tops=l=>(TOP[l[0]]||[]).map(([a,en,no,ty])=>[a,a==='quiz'?QZ:t(en,no),ty]);
const labOn=u=> S.labs[u]!==0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const count=cat=>labsOf(cat).reduce((a,l)=>a+tops(l).length,0);
const LVC={la:'lt',jet:'a320'};
const lvt=l=>l[4]?`<span class="tag ${LVC[l[4]]}">${esc(L(LV[l[4]]))}</span>`:'';
const isDone=l=>LAB.done(l[1])>=60;

function draw(){
  const no=LAB.lang==='no', path=S.cat==='path';
  const doneN=ALL.filter(isDone).length;
  el('lead').textContent=no?'Teorien bak flygingen, som interaktive modeller du kan stille på. 25 labber i ni moduler, fra aerodynamikk til menneskelige faktorer, bygget på A320.':'The theory behind flying, as interactive models you can adjust. 26 labs in nine modules, from principles of flight to human performance, built on a light twin and the A320.';
  el('stats').innerHTML=`<div><b>${ALL.length}</b><span>${no?'labber':'labs'}</span></div><div><b>${PATH.length}</b><span>${no?'moduler':'modules'}</span></div><div><b>${count('all')}</b><span>${no?'emner':'topics'}</span></div><div><b>${doneN}<span style="font-size:16px;color:var(--ink-3)"> / ${ALL.length}</span></b><span>${no?'fullført':'done'}</span><span class="pbar"><i style="width:${doneN/ALL.length*100}%"></i></span></div>`;
  el('tabs').innerHTML=`<button role="tab" data-c="path" aria-selected="${path}" class="${path?'on':''}">${no?'Læringsløp':'Learning path'}<i>${ALL.length}</i></button><button role="tab" data-c="all" aria-selected="${!path}" class="${!path?'on':''}">${no?'Alle emner':'All topics'}<i>${count('all')}</i></button>`;
  el('foot').textContent=no?'Opplæringsmodeller for forståelse, ikke en spørsmålsbank. Følg AIP, flyhåndboken og operatørens prosedyrer for tallene du flyr etter.':'Teaching models for understanding, not a question bank. Follow the AIP, the flight manual and your operator’s procedures for numbers you fly with.';
  if(path) drawPath(); else drawReg();
}
function drawPath(){
  const no=LAB.lang==='no'; let n=0;
  const nxt=ALL.find(l=>!isDone(l));
  const nxtIdx=nxt?ALL.indexOf(nxt)+1:0, nxtMod=nxt?PATH.findIndex(m=>m.labs.includes(nxt)):-1;
  const started=ALL.some(l=>LAB.done(l[1])>0);
  const nextCard=nxt?`<div class="next"><div><small>${started?(no?'Fortsett':'Continue'):(no?'Start her':'Start here')} · ${no?'Modul':'Module'} ${nxtMod+1}</small><b>${nxtIdx}. ${esc(nm(nxt))}</b><p>${no?'Gå gjennom modulene i rekkefølge; hver bygger på den forrige. En lab regnes som fullført ved 60 % eller mer på quizen.':'Work through the modules in order; each builds on the one before. A lab counts as done at 60 % or more on its quiz.'}</p></div><a class="btn pri lg" href="${nxt[0]}">${started?(no?'Fortsett':'Continue'):(no?'Start':'Start')} →</a></div>`:'';
  el('view').innerHTML=nextCard+`<div class="mods">`+PATH.map((m,mi)=>{ const dn=m.labs.filter(isDone).length;
    return `<section class="mod" id="m-${m.k}"><div class="mh"><span class="no">${no?'MODUL':'MODULE'} ${String(mi+1).padStart(2,'0')}</span><h2><a href="#${m.k}" data-c="${m.k}" title="${no?'Vis emnene':'Show the topics'}">${esc(L(m))}</a></h2><span class="mp"><span class="bar">${m.labs.map(l=>`<i class="${isDone(l)?'d':''}"></i>`).join('')}</span>${dn} / ${m.labs.length} ${no?'fullført':'done'}</span></div><div class="labs">`+
    m.labs.map(l=>{ n++; const d=LAB.done(l[1]), isN=l===nxt, dn1=d>=60;
      const st=dn1?`<span class="ok">${no?'Fullført':'Done'}</span><span class="v">${d} %</span>`:(isN?`<span class="go">${no?'Neste':'Next'} →</span>`:(d?`<span class="v">${no?'Quiz':'Quiz'} ${d} %</span>`:''));
      return `<a class="lrow ${isN?'nx':''} ${dn1?'dn':''}" href="${l[0]}"><span class="n">${String(n).padStart(2,'0')}</span><span class="t"><b>${esc(nm(l))}</b>${lvt(l)}</span><span class="tp">${tops(l).filter(x=>x[2]!=='quiz').map(x=>esc(L(x[1]))).join(' · ')}</span><span class="st">${st}</span></a>`; }).join('')+`</div></section>`; }).join('')+`</div>`+
    `<section class="cap"><div class="mh"><span class="no">${no?'AVSLUTNING':'CAPSTONE'}</span><h2>${no?'A320 simulatortest':'A320 sim assessment'}</h2></div><div class="labs"><a class="lrow" href="simcheck.html"><span class="n">→</span><span class="t"><b>${no?'Sett det sammen før simulatorsjekken':'Put it together before the sim check'}</b><span class="tag a320">A320</span></span><span class="tp">${no?'Teori, prosedyrer og scenarioer fra hele læringsløpet, i formatet til en simulatortest for flyselskap.':'Theory, procedures and scenarios from the whole path, in the format of an airline simulator assessment.'}</span><span class="st"><span class="go">${no?'Åpne':'Open'} →</span></span></a></div></section>`;
}
function drawReg(){
  const no=LAB.lang==='no', mod=PATH.find(m=>m.k===S.cat), labs=labsOf(S.cat);
  const tcount=k=>labs.filter(l=>labOn(l[0])).reduce((a,l)=>a+tops(l).filter(x=>x[2]===k).length,0);
  const catBtns=`<button data-c="all" class="${S.cat==='all'?'on':''}">${no?'Alle moduler':'All modules'}<i>${count('all')}</i></button>`+PATH.map((m,i)=>`<button data-c="${m.k}" class="${S.cat===m.k?'on':''}">${i+1}. ${esc(L(m))}<i>${count(m.k)}</i></button>`).join('');
  const sel=`<select id="msel" aria-label="${no?'Modul':'Module'}"><option value="all">${no?'Alle moduler':'All modules'} (${count('all')})</option>${PATH.map((m,i)=>`<option value="${m.k}" ${S.cat===m.k?'selected':''}>${i+1}. ${esc(L(m))} (${count(m.k)})</option>`).join('')}</select>`;
  const keepQ=el('q')?el('q').value:S.q, wasOpen=document.querySelector('details.more')?.open;
  el('view').innerHTML=`<div class="reg"><aside class="filt">
      <div class="find"><input id="q" type="search" autocomplete="off" placeholder="${no?'Filtrer emner …':'Filter topics …'}" aria-label="${no?'Filtrer emner':'Filter topics'}"></div>
      <div class="modsel">${sel}</div>
      <div class="catbox"><p class="fh">${no?'Modul':'Module'}</p><div class="cats" id="cats">${catBtns}</div></div>
      <details class="more"${(wasOpen||matchMedia('(min-width:901px)').matches)?' open':''}><summary>${no?'Filtre':'Filters'}</summary>
      <div><p class="fh">Type</p><div class="chk" id="types">${TYPES.map(([k,n])=>`<label><input type="checkbox" data-t="${k}" ${S.types[k]?'checked':''}><span class="tag t-${k}">${esc(L(n))}</span><i>${tcount(k)}</i></label>`).join('')}</div></div>
      <div style="margin-top:20px"><p class="fh"><span>${no?'Labber':'Labs'}</span><span><button data-a="all">${no?'Alle':'All'}</button><button data-a="none">${no?'Ingen':'None'}</button></span></p><div class="chk labs2" id="lay">${labs.map(l=>`<label><input type="checkbox" data-l="${l[0]}" ${labOn(l[0])?'checked':''}>${esc(nm(l))}<i>${tops(l).length}</i></label>`).join('')}</div></div>
      </details>
    </aside><div class="tblw"><div class="tblh"><b>${mod?esc(L(mod)):(no?'Alle emner':'All topics')}</b><span id="stat"></span></div><div id="res"></div></div></div>`;
  el('q').value=keepQ;
  el('q').addEventListener('input',e=>{ S.q=e.target.value; rows(); });
  el('msel').addEventListener('change',e=>go(e.target.value));
  rows();
}
function rows(){
  const no=LAB.lang==='no', q=S.q.trim().toLowerCase(); const out=[];
  labsOf(S.cat).forEach(l=>{ if(!labOn(l[0])) return; tops(l).forEach(([a,tn,ty])=>{
    if(!S.types[ty]) return; const name=L(tn), lab=nm(l);
    if(q && !(name+' '+lab+' '+tn.en+' '+tn.no).toLowerCase().includes(q)) return;
    out.push(`<tr><td><a href="${l[0]}#${a}">${esc(name)}</a><span class="lt">${esc(lab)}</span></td><td class="lab"><a href="${l[0]}">${esc(lab)}</a>${lvt(l)}</td><td class="ty"><span class="tag t-${ty}">${esc(L(TYPES.find(x=>x[0]===ty)[1]))}</span></td></tr>`); }); });
  el('res').innerHTML=`<table class="list"><thead><tr><th>${no?'Emne':'Topic'}</th><th class="hlab">Lab</th><th>Type</th></tr></thead><tbody>${out.join('')}</tbody></table>`+(out.length?'':`<div class="empty">${no?'Ingen emner passer filteret.':'No topics match the filter.'}</div>`);
  el('stat').textContent=no?`${out.length} emner vist`:`${out.length} topics shown`;
}
const go=k=>{ S.cat=k; history.replaceState(null,'','#'+k); draw(); window.scrollTo({top:0}); };
el('tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-c]'); if(b) go(b.dataset.c); });
el('view').addEventListener('click',e=>{
  const a=e.target.closest('a[data-c]'); if(a){ e.preventDefault(); go(a.dataset.c); return; }
  const c=e.target.closest('.cats button'); if(c){ go(c.dataset.c); return; }
  const b=e.target.closest('button[data-a]'); if(b){ labsOf(S.cat).forEach(l=>S.labs[l[0]]=b.dataset.a==='all'?1:0); save(); draw(); } });
el('view').addEventListener('change',e=>{ const i=e.target; if(!i.dataset.l&&!i.dataset.t) return; if(i.dataset.l) S.labs[i.dataset.l]=i.checked?1:0; if(i.dataset.t) S.types[i.dataset.t]=i.checked?1:0; save(); draw(); });
window.addEventListener('hashchange',()=>{ const k=location.hash.slice(1); if(valid(k)){ S.cat=k; draw(); } });
LAB.start('labs'); LAB.onLang(draw); draw();
})();
</script>
