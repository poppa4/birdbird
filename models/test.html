<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cockpit glTF check</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#111;color:#ddd;font:12px system-ui,sans-serif;overflow:hidden}canvas{display:block}#info{position:absolute;left:8px;top:6px;white-space:pre;text-shadow:0 1px 2px #000}</style>
</head>
<body>
<div id="info">loading…</div>
<script src="../three.min.js"></script>
<script src="../vendor/three-r128/GLTFLoader.js"></script>
<script src="../vendor/three-r128/meshopt_decoder.js"></script>
<script>
/* Loads models/<ac>-cockpit.glb with the site's three.js r128 and shows it from the left-seat eye in the sidecar JSON.
   ?ac=c172|b200|da42  &yaw=&pitch= (cockpit3d.js view angles, degrees)  &fov= (vertical)  &seat=left|right
   &panel=<image url> puts a picture on panel_face (flipY=false, as the app would). Result in window.__result. */
(async function(){
  const q=new URLSearchParams(location.search), ac=q.get('ac')||'c172';
  const info=document.getElementById('info');
  const R=window.__result={ac,ok:false,errors:[]};
  addEventListener('error',e=>R.errors.push(String(e.message)));
  try{
    const side=await (await fetch(`${ac}-cockpit.json`)).json();
    const W=innerWidth, H=innerHeight;
    const ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(W,H); ren.setPixelRatio(1); ren.outputEncoding=THREE.sRGBEncoding;
    document.body.appendChild(ren.domElement);
    const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9ec3e6);
    scene.add(new THREE.HemisphereLight(0xdfeaff,0x5a5246,1.15));
    const sun=new THREE.DirectionalLight(0xfff4e0,1.1); sun.position.set(-0.35,1,-0.45); scene.add(sun);
    // ground for context
    const gnd=new THREE.Mesh(new THREE.PlaneGeometry(800,800),new THREE.MeshLambertMaterial({color:0x51603f})); gnd.rotation.x=-Math.PI/2; gnd.position.y=-1.9; scene.add(gnd);
    const loader=new THREE.GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
    const t0=performance.now();
    const gltf=await new Promise((res,rej)=>loader.load(`${ac}-cockpit.glb`,res,undefined,rej));
    R.loadMs=Math.round(performance.now()-t0);
    const root=gltf.scene; scene.add(root);
    let tris=0, meshes=0; const names=new Set();
    root.traverse(o=>{ if(o.name) names.add(o.name); if(o.isMesh){ meshes++; const g=o.geometry; tris+=(g.index?g.index.count:g.attributes.position.count)/3;
      const m=o.material; if(m&&m.aoMap){ m.aoMapIntensity=1.0; } } });
    R.triangles=tris; R.meshes=meshes; R.nodes=[...names].sort();
    R.missing=side.nodes.filter(n=>!names.has(n));
    for(const f of Object.keys(side.faces||{})) if(!names.has(f)) R.missing.push(f);
    // controls must be separate nodes with the documented pivots
    R.pivotErr=0; for(const [k,c] of Object.entries(side.controls||{})){ const o=root.getObjectByName(k); if(!o){ R.missing.push(k); continue; } o.updateMatrixWorld(true); const p=new THREE.Vector3().setFromMatrixPosition(o.matrixWorld); R.pivotErr=Math.max(R.pivotErr,p.distanceTo(new THREE.Vector3(...c.pivot))); }
    const pimg=q.get('panel');
    // a picture of the whole panel drawing: each *_face shows its uv_rect of it (as the app would with the live drawing)
    if(pimg){ new THREE.ImageLoader().load(pimg,img=>{
      Object.entries(side.faces).forEach(([n,f])=>{ const o=root.getObjectByName(n); const mesh=o&&(o.isMesh?o:o.children.find(c=>c.isMesh)); if(!mesh) return;
        const t=new THREE.Texture(img); t.flipY=false; t.encoding=THREE.sRGBEncoding; t.anisotropy=4; t.needsUpdate=true; const [W,H]=f.drawing_size, r=f.uv_rect;
        t.repeat.set(r[2]/W,r[3]/H); t.offset.set(r[0]/W,r[1]/H);
        mesh.material=new THREE.MeshBasicMaterial({map:t,transparent:true,alphaTest:0.02}); }); R.panelReady=true; draw(); }); }
    const seat=q.get('seat')==='right'?'right':'left', eye=side.eye[seat];
    const cam=new THREE.PerspectiveCamera(+(q.get('fov')||62),W/H,0.02,2000); cam.position.set(...eye); cam.rotation.order='YXZ';
    const yaw=+(q.get('yaw')||9), pitch=+(q.get('pitch')||-16);
    cam.rotation.set(pitch*Math.PI/180,-yaw*Math.PI/180,0,'YXZ');
    function draw(){ ren.render(scene,cam); }
    draw(); R.calls=ren.info.render.calls; R.ok=!R.missing.length&&!R.errors.length;
    info.textContent=`${ac}: ${tris} triangles, ${meshes} meshes, ${R.nodes.length} named nodes, load ${R.loadMs} ms`+(R.missing.length?`\nMISSING: ${R.missing.join(', ')}`:'');
    window.__draw=draw; window.__cam=cam; window.__root=root;
  }catch(e){ R.errors.push(String(e&&e.stack||e)); info.textContent='ERROR '+e; }
  R.done=true;
})();
</script>
</body>
</html>
