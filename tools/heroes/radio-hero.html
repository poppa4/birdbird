<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<canvas id="c" width="3200" height="2000" style="width:1600px;height:1000px"></canvas>
<script>
/* NORDAP radio trainer hero: the same flight deck frame as the IFR hero, on short final at dusk.
   Runway 36 lit ahead, the tower with its beacon, a fjord catching the last light, and the COM panel tuned to Tower. */
const cv=document.getElementById('c'), g=cv.getContext('2d'); const S=2; g.scale(S,S);
const W=1600,H=1000;
let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
const HZ=455; /* horizon */
/* ---- sky: same palette as the IFR hero, a little later in the evening ---- */
let sk=g.createLinearGradient(0,0,0,HZ);
sk.addColorStop(0,'#1A2550'); sk.addColorStop(.32,'#3B4A86'); sk.addColorStop(.58,'#8A6E9C'); sk.addColorStop(.76,'#E08A6A'); sk.addColorStop(.9,'#F6B477'); sk.addColorStop(1,'#FBD39A');
g.fillStyle=sk; g.fillRect(0,0,W,HZ+2);
/* sun just below the horizon, right of centre */
const sx=1180, sy=HZ+18;
let sg=g.createRadialGradient(sx,sy,0,sx,sy,520); sg.addColorStop(0,'rgba(255,236,190,.95)'); sg.addColorStop(.12,'rgba(255,205,140,.55)'); sg.addColorStop(.45,'rgba(240,150,110,.18)'); sg.addColorStop(1,'rgba(240,150,110,0)');
g.fillStyle=sg; g.fillRect(0,0,W,HZ+2);
/* thin stratus streaks lit from below */
for(let i=0;i<70;i++){ const y=HZ-30-Math.pow(rnd(),1.6)*300, x=rnd()*W, w=200+rnd()*520, h=3+rnd()*9; const d=Math.abs(x-sx)/W;
  const a=(.10+rnd()*.16)*(1-(HZ-y)/360);
  const c=y>HZ-120? `rgba(255,${190-d*60|0},${150-d*40|0},${a})` : `rgba(${150+rnd()*40|0},${120+rnd()*30|0},${170+rnd()*30|0},${a})`;
  let eg=g.createRadialGradient(x,y,0,x,y,w/2); eg.addColorStop(0,c); eg.addColorStop(1,'rgba(0,0,0,0)'); g.save(); g.translate(x,y); g.scale(1,h/w*2.2); g.translate(-x,-y); g.fillStyle=eg; g.beginPath(); g.arc(x,y,w/2,0,Math.PI*2); g.fill(); g.restore(); }
/* first stars high up */
for(let i=0;i<60;i++){ const x=rnd()*W, y=rnd()*150; g.fillStyle=`rgba(255,255,255,${.25+rnd()*.5})`; g.fillRect(x,y,1.1,1.1); }
/* ---- distant mountains in haze ---- */
function ridge(base,amp,col,step,s0){ seed=s0; g.fillStyle=col; g.beginPath(); g.moveTo(0,H); let y=base;
  for(let x=0;x<=W+step;x+=step){ y+= (rnd()-.5)*amp; y=Math.max(base-amp*2.2,Math.min(base+amp*.6,y)); g.lineTo(x,y); } g.lineTo(W,H); g.closePath(); g.fill(); }
ridge(HZ-6,9,'#7E6C8E',14,11); ridge(HZ+2,8,'#5B5574',12,23); ridge(HZ+10,7,'#3C3D56',10,37);
/* ---- ground: dark land, a fjord reflecting the sky ---- */
let gr=g.createLinearGradient(0,HZ,0,H); gr.addColorStop(0,'#2B2E40'); gr.addColorStop(.25,'#1B1F2B'); gr.addColorStop(1,'#0D1017'); g.fillStyle=gr; g.fillRect(0,HZ+14,W,H);
/* fjord: a long arm of water to the right, catching the sunset */
g.save(); g.beginPath(); g.moveTo(1010,HZ+15); g.bezierCurveTo(1120,HZ+22,1260,HZ+40,1600,HZ+95); g.lineTo(1600,HZ+190); g.bezierCurveTo(1380,HZ+120,1200,HZ+55,1060,HZ+24); g.closePath(); g.clip();
let wg=g.createLinearGradient(0,HZ+14,0,HZ+190); wg.addColorStop(0,'#E9A777'); wg.addColorStop(.35,'#9C6E86'); wg.addColorStop(1,'#2B2D45'); g.fillStyle=wg; g.fillRect(1000,HZ,600,220);
for(let i=0;i<160;i++){ const x=1020+rnd()*580, y=HZ+18+Math.pow(rnd(),1.4)*160; g.fillStyle=`rgba(255,215,170,${.08+rnd()*.18})`; g.fillRect(x,y,8+rnd()*40,1); }
g.restore();
/* fields and forest texture */
for(let i=0;i<2600;i++){ const t=Math.pow(rnd(),1.7), y=HZ+16+t*(H-HZ), x=rnd()*W, w=(4+rnd()*30)*(0.3+t*3), h=(1+rnd()*2)*(0.4+t*3);
  g.fillStyle=rnd()<.5?`rgba(20,26,34,${.25+rnd()*.35})`:`rgba(60,58,78,${.05+rnd()*.12})`; g.fillRect(x,y,w,h); }
/* ---- perspective for the runway ---- */
const VX=740; /* vanishing point x */
const P=(u,d)=>{ /* u lateral (m), d distance ahead (m) -> screen; eye 55 m up on short final */ const cam=55, f=1500; return [VX+u*f/d, HZ+12+cam*f/d]; };
/* town lights spread on the land */
function lights(n,x0,x1,d0,d1,col,sz){ for(let i=0;i<n;i++){ const d=d0+Math.pow(rnd(),.6)*(d1-d0), u=(x0+rnd()*(x1-x0)); const [x,y]=P(u,d); if(y<HZ+15) continue;
  const r=(sz||1.1)*Math.max(.45,Math.min(2,2600/d)); g.fillStyle=col(rnd()); g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); } }
lights(900,-14000,-900,2600,40000,r=>`rgba(255,${190+r*40|0},${120+r*50|0},${.5+r*.4})`);
lights(500,900,12000,2600,30000,r=>`rgba(255,${200+r*40|0},${140+r*60|0},${.45+r*.4})`);
/* roads with sodium lights, running away from you */
for(const [u0,u1] of [[-380,-2600],[-1300,-5200],[520,3600],[1500,900]]){ for(let d=260;d<26000;d*=1.06){ const t=(d-260)/25740; const [x,y]=P(u0+(u1-u0)*t,d); if(y>785||y<HZ+13) continue; const r=Math.max(.5,Math.min(2.4,1300/d)); g.fillStyle='rgba(255,176,90,.85)'; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); } }
/* farms and houses closer in */
for(let i=0;i<140;i++){ const d=500+Math.pow(rnd(),.8)*7000, u=(rnd()-.5)*5200; if(Math.abs(u)<260) continue; const [x,y]=P(u,d); if(y>780) continue; const r=Math.max(.6,Math.min(2.2,1600/d)); g.fillStyle=`rgba(255,${200+rnd()*40|0},${130+rnd()*60|0},${.55+rnd()*.4})`; g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); }
/* glow of the town */
let tg=g.createRadialGradient(420,HZ+40,0,420,HZ+40,380); tg.addColorStop(0,'rgba(255,170,100,.14)'); tg.addColorStop(1,'rgba(255,170,100,0)'); g.fillStyle=tg; g.fillRect(0,0,W,H);
/* runway 36: 1500 m by 45 m, threshold 1100 m ahead */
const T0=820, T1=T0+1800, HW=22.5;
const quad=(a,b,c,d,col)=>{ g.fillStyle=col; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.lineTo(...d); g.closePath(); g.fill(); };
quad(P(-HW,T0),P(HW,T0),P(HW,T1),P(-HW,T1),'#22252E');
/* centreline and threshold marks, faint */
for(let d=T0+60;d<T1-40;d+=50){ const a=P(-.5,d),b=P(.5,d+28); g.fillStyle='rgba(200,205,215,.28)'; g.fillRect(a[0],b[1],Math.max(.6,b[0]-a[0]),Math.max(.6,a[1]-b[1])); }
for(let k=-8;k<=8;k++){ if(!k) continue; const a=P(k*2.4-.8,T0+6),b=P(k*2.4+.8,T0+36); g.fillStyle='rgba(215,220,228,.32)'; g.fillRect(a[0],b[1],Math.max(.6,b[0]-a[0]),a[1]-b[1]); }
const glow=(x,y,r,col,a)=>{ let q=g.createRadialGradient(x,y,0,x,y,r*6); q.addColorStop(0,col.replace('A',a)); q.addColorStop(.18,col.replace('A',a*.35)); q.addColorStop(1,col.replace('A',0)); g.fillStyle=q; g.fillRect(x-r*6,y-r*6,r*12,r*12); g.fillStyle=col.replace('A',Math.min(1,a+.2)); g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); };
const lr=d=>Math.max(.6,Math.min(4,1500/d));
/* edge lights (white, amber the last 600 m seen from here is the far end: keep white), threshold green, end red */
for(let d=T0;d<=T1;d+=60){ for(const s of [-1,1]){ const [x,y]=P(s*(HW+1.5),d); glow(x,y,lr(d),'rgba(255,246,225,A)',.95); } }
for(let u=-HW;u<=HW;u+=3.2){ const [x,y]=P(u,T0-2); glow(x,y,lr(T0)*.9,'rgba(90,255,150,A)',.9); const [x2,y2]=P(u,T1+2); glow(x2,y2,lr(T1)*.8,'rgba(255,70,60,A)',.8); }
/* approach lights: centre row and crossbars, 900 m */
for(let d=T0-900;d<T0-30;d+=30){ const [x,y]=P(0,d); if(y>H) continue; for(const u of [-2,0,2]){ const [a,b]=P(u,d); glow(a,b,lr(d)*.9,'rgba(255,240,210,A)',.85); } }
for(const d of [T0-300,T0-600]){ for(let u=-15;u<=15;u+=2.5){ const [a,b]=P(u,d); glow(a,b,lr(d)*.85,'rgba(255,240,210,A)',.8); } }
/* sequenced flashers: one caught mid-run */
{ const [a,b]=P(0,T0-480); glow(a,b,lr(T0-480)*1.8,'rgba(230,240,255,A)',1); }
/* PAPI left of the runway: two white, two red */
for(let i=0;i<4;i++){ const [a,b]=P(-HW-14-i*9,T0+300); glow(a,b,lr(T0+300)*1.1,i<2?'rgba(255,60,50,A)':'rgba(255,250,240,A)',.95); }
/* taxiway (blue edges) to the apron on the right */
for(let d=T0+150;d<T1;d+=90){ for(const u of [HW+90,HW+112]){ const [a,b]=P(u,d); glow(a,b,lr(d)*.6,'rgba(80,140,255,A)',.85); } }
for(let u=HW+20;u<HW+100;u+=12){ for(const d of [T1-120]){ const [a,b]=P(u,d); glow(a,b,lr(d)*.55,'rgba(80,140,255,A)',.8); } }
/* apron floodlights and the terminal */
for(let i=0;i<7;i++){ const [a,b]=P(HW+170+i*40,T0+800+i*50); glow(a,b,lr(T0+700)*1.3,'rgba(255,214,150,A)',.9); }
{ const [a,b]=P(HW+160,T0+820), [c,d]=P(HW+460,T0+1150); g.fillStyle='rgba(255,200,130,.16)'; g.fillRect(a[0],d[1]-3,c[0]-a[0],b[1]-d[1]+4); }
/* the tower: a slim shaft, lit cab, green/white beacon on top */
{ const [bx,by]=P(HW+330,T0+1050); const sc=lr(T0+1050)/1.3; const tw=7*sc, th=58*sc;
  g.fillStyle='#141823'; g.fillRect(bx-tw/2,by-th,tw,th);
  g.fillStyle='#1C2230'; g.beginPath(); g.moveTo(bx-tw*1.9,by-th); g.lineTo(bx+tw*1.9,by-th); g.lineTo(bx+tw*1.6,by-th-tw*1.6); g.lineTo(bx-tw*1.6,by-th-tw*1.6); g.closePath(); g.fill();
  let cg=g.createLinearGradient(0,by-th-tw*1.5,0,by-th); cg.addColorStop(0,'rgba(140,210,200,.9)'); cg.addColorStop(1,'rgba(70,150,150,.7)'); g.fillStyle=cg; g.fillRect(bx-tw*1.55,by-th-tw*1.45,tw*3.1,tw*1.1);
  g.fillStyle='#141823'; g.fillRect(bx-tw*1.7,by-th-tw*1.9,tw*3.4,tw*.4); g.fillRect(bx-.6,by-th-tw*3.4,1.2,tw*1.6);
  glow(bx,by-th-tw*3.5,2,'rgba(120,255,160,A)',1); glow(bx-tw*1.4,by-th-tw*.2,1.2,'rgba(255,60,50,A)',.9); }
/* haze over the horizon */
let hz=g.createLinearGradient(0,HZ-40,0,HZ+60); hz.addColorStop(0,'rgba(250,200,160,0)'); hz.addColorStop(.5,'rgba(250,190,150,.18)'); hz.addColorStop(1,'rgba(250,190,150,0)'); g.fillStyle=hz; g.fillRect(0,HZ-40,W,100);
/* ---- the flight deck frame: same as the IFR hero ---- */
g.fillStyle='#0B0F15';
g.beginPath(); g.moveTo(0,0); g.lineTo(58,0); g.lineTo(18,850); g.lineTo(0,855); g.closePath(); g.fill();
g.beginPath(); g.moveTo(W,0); g.lineTo(W-58,0); g.lineTo(W-18,850); g.lineTo(W,855); g.closePath(); g.fill();
/* glareshield */
let gs=g.createLinearGradient(0,790,0,H); gs.addColorStop(0,'#141A22'); gs.addColorStop(.06,'#0D1219'); gs.addColorStop(1,'#07090D'); g.fillStyle=gs;
g.beginPath(); g.moveTo(0,850); g.quadraticCurveTo(W/2,770,W,850); g.lineTo(W,H); g.lineTo(0,H); g.closePath(); g.fill();
g.strokeStyle='rgba(255,190,140,.18)'; g.lineWidth=1.2; g.beginPath(); g.moveTo(0,850); g.quadraticCurveTo(W/2,770,W,850); g.stroke();
/* the COM panel, where the IFR hero has its attitude display */
const bx0=598,by0=818,bw=380,bh=200;
g.fillStyle='#1A2028'; g.beginPath(); g.roundRect(bx0-8,by0-8,bw+16,bh+16,8); g.fill();
g.fillStyle='#05080B'; g.beginPath(); g.roundRect(bx0,by0,bw,bh,5); g.fill();
let gl=g.createRadialGradient(bx0+bw/2,by0+60,10,bx0+bw/2,by0+60,280); gl.addColorStop(0,'rgba(60,180,255,.08)'); gl.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gl; g.fillRect(bx0,by0,bw,bh);
g.font='600 11px "IBM Plex Mono",Menlo,monospace'; g.textBaseline='alphabetic';
g.fillStyle='#6F8797'; g.fillText('COM 1',bx0+18,by0+26); g.fillText('ACTIVE',bx0+86,by0+26); g.fillText('STBY',bx0+262,by0+26);
const lcd=(t,x,y,size,col)=>{ g.font=`500 ${size}px "IBM Plex Mono",Menlo,monospace`; g.shadowColor=col; g.shadowBlur=10; g.fillStyle=col; g.fillText(t,x,y); g.shadowBlur=0; };
lcd('118.300',bx0+84,by0+72,40,'#7CF0A8'); lcd('121.700',bx0+260,by0+66,24,'#E8C46A');
g.fillStyle='#9FB2C0'; g.font='600 12px "IBM Plex Sans",Helvetica,sans-serif'; g.fillText('NORDAP TOWER',bx0+86,by0+96);
/* RX lamp lit, TX dark */
const lamp=(x,y,t,on)=>{ g.fillStyle=on?'rgba(124,240,168,.95)':'#1F2A33'; g.beginPath(); g.roundRect(x,y,34,16,3); g.fill(); g.fillStyle=on?'#062012':'#556774'; g.font='700 10px "IBM Plex Mono",monospace'; g.fillText(t,x+9,y+12); if(on){ g.shadowColor='#7CF0A8'; g.shadowBlur=14; g.fillStyle='rgba(124,240,168,.4)'; g.fillRect(x,y,34,16); g.shadowBlur=0; } };
lamp(bx0+18,by0+50,'RX',true); lamp(bx0+18,by0+74,'TX',false);
/* a line of the transcript under it */
g.strokeStyle='#1F2A33'; g.lineWidth=1; g.beginPath(); g.moveTo(bx0+16,by0+116); g.lineTo(bx0+bw-16,by0+116); g.stroke();
g.font='500 12.5px "IBM Plex Mono",Menlo,monospace'; g.fillStyle='#C9D6DF'; g.fillText('L-AE, wind 340 degrees 8 knots,',bx0+18,by0+142); g.fillText('runway 36, cleared to land.',bx0+18,by0+162);
g.fillStyle='#6F8797'; g.fillText('▍',bx0+18+g.measureText('runway 36, cleared to land.').width+6,by0+162);
/* soft vignette */
let vg=g.createRadialGradient(W/2,H*.42,W*.3,W/2,H*.5,W*.78); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.35)'); g.fillStyle=vg; g.fillRect(0,0,W,H);
document.title='done';
</script></body></html>
