<body data-title="Flight Intelligence">
<script src="site.js?v=143"></script>
<!-- one search bar, in the same place and box as on every other page; here it searches your workspace (search.js leaves a wired box alone) -->
<div class="nsearch noprint" role="search" data-w="ws">
  <form class="in" id="wsSearchForm" autocomplete="off">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="wsQ" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" aria-label="Search your documents, notes, packs and routes" placeholder="Search your aircraft, documents, notes, packs and routes">
  </form>
</div>
<div class="page ws">
  <header class="lhead ws-head" id="top">
    <div class="brand">
      <a class="ws-home" id="wsHome" href="#/"><span id="wsHomeT">Open the desk</span> <span aria-hidden="true">→</span></a>
      <div class="eyebrow">NORDAP</div>
      <h1 id="wsH1">Flight Intelligence</h1>
      <p id="wsLede">Ask the AI, work in your own documents and take notes, with your aircraft, briefing packs and routes in one place.</p>
    </div>
  </header>
  <div class="ws-status" id="wsStatus" role="status" aria-live="polite"></div>

  <div class="ws-body">
    <div class="ws-side" id="wsSide"><nav class="ws-rail" id="wsRail" aria-label="Flight Intelligence"></nav></div>
    <main class="ws-main" id="wsMain" tabindex="-1">
      <p class="ws-loading" id="wsLoading">Opening Flight Intelligence…</p>
    </main>
  </div>
  <div class="desk" id="wsDesk" hidden></div>
  <noscript><p class="ws-loading">Workspace needs JavaScript: everything in it is stored in this browser.</p></noscript>
</div>

<dialog class="ws-dlg" id="wsDlg" aria-labelledby="wsDlgH"></dialog>
<div class="ws-toast" id="wsToast" role="status" aria-live="polite" hidden></div>
<input type="file" id="wsFile" multiple hidden accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,application/pdf,text/plain,image/*">
<input type="file" id="wsBackupFile" hidden accept=".zip,application/zip">

<script src="lab.js?v=62"></script>

<script src="deskcore.js?v=4"></script>
